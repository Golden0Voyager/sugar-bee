services:
  sugar-bee:
    build:
      context: .
      dockerfile: Dockerfile
    image: sugar-bee:latest
    container_name: sugar-bee
    restart: unless-stopped
    # 只监听回环地址，公网一律经宿主机 nginx 反代进入（避免防火墙误放行时裸暴露 Flask）
    ports:
      - "127.0.0.1:${SUGAR_BEE_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      # 用例剖面：容器时区跟随业务时区，gunicorn 日志与应用时间的日历天一致
      - TZ=Asia/Shanghai
      # 数据库路径（Docker 内使用挂载的目录）
      - SUGAR_BEE_DB_PATH=/app/db_data/glucose.db
      # Gunicorn 配置（可通过环境变量覆盖）
      # SQLite 不支持并发写入，默认 2 个 sync worker 足够（gunicorn.conf.py 自身默认为 1）；
      # worker 调多只会放大 "database is locked" 概率。
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
      - GUNICORN_LOG_LEVEL=${GUNICORN_LOG_LEVEL:-info}
      # Flask 配置
      - FLASK_ENV=production
      # 当前以 HTTP / IP 直连访问，cookie 不能带 Secure 标志；接入 HTTPS 后改回 true
      - SESSION_COOKIE_SECURE=false
      - PYTHONUNBUFFERED=1
    volumes:
      # 数据库目录挂载（使用目录而非文件，避免 Docker 自动创建目录的问题）
      - ./db_data:/app/db_data
      # 备份目录
      - ./backups:/app/backups
      # 头像上传目录
      - ./static/avatars:/app/static/avatars
      # Garmin Token 持久化
      - ./.garmin_tokens:/app/.garmin_tokens
      # 用户数据目录
      - ./user_data:/app/user_data
      # 环境变量文件（可选，如果已用 env_file）
      # - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# 可选：使用独立卷管理（更健壮，避免 bind mount 的文件类型问题）
# volumes:
#   sugar_bee_data:
