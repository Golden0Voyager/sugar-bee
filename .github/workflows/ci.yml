name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pytest-flask flask

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          FLASK_ENV: testing
        run: python -m pytest tests/ -q --cov=.

      - name: Check Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile wsgi.py

      - name: Test Docker build
        # 构建机在境外，腾讯镜像源经常断流；这里改用官方 PyPI。
        run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple -t sugar-bee:ci .
