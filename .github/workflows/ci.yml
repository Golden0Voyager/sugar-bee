name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pytest-flask flask ruff mypy

      - name: Run ruff check
        run: ruff check app.py ai_client.py generate_report.py glucose_parser.py user_manager.py settings.py models.py routes/ utils/ mcp_adapter/ core/ services/

      - name: Run mypy
        run: mypy app.py ai_client.py generate_report.py glucose_parser.py user_manager.py settings.py models.py routes/ utils/ mcp_adapter/ core/ services/ || true

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          FLASK_ENV: testing
        run: python -m pytest tests/ -q --cov

      - name: Enforce coverage threshold
        run: coverage report

      - name: Check Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile wsgi.py

      - name: Test Docker build
        run: docker build -t sugar-bee:ci .
