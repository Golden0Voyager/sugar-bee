<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366F1">
    <title>蜜蜂控糖 - 登录</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐝</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --md-primary: #6366F1;
            --md-primary-dark: #4F46E5;
            --md-primary-light: #A5B4FC;
            --md-background: #F5F3FF;
        }
        * { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            background: var(--md-background);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.12);
            padding: 40px 32px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-header .logo {
            font-size: 3rem;
            margin-bottom: 8px;
        }
        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 4px;
        }
        .login-header p {
            color: #64748B;
            font-size: 0.9rem;
        }
        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1.5px solid #E2E8F0;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: var(--md-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .btn-primary {
            background: var(--md-primary);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background: var(--md-primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .alert {
            border-radius: 12px;
            font-size: 0.9rem;
        }
        .form-label {
            font-weight: 500;
            color: #475569;
            font-size: 0.9rem;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94A3B8;
            cursor: pointer;
            padding: 4px;
        }
        .password-toggle:hover { color: #64748B; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo">🐝</div>
            <h1>蜜蜂控糖</h1>
            <p>勤劳控糖，甜蜜生活</p>
        </div>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-circle me-2"></i>{{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success d-flex align-items-center" role="alert">
            <i class="bi bi-check-circle me-2"></i>{{ success }}
        </div>
        {% endif %}

        {% if set_password_mode %}
        <!-- 首次设置密码模式 -->
        <div class="alert alert-info d-flex align-items-center mb-3">
            <i class="bi bi-info-circle me-2"></i>欢迎回来！请为账号「{{ username }}」设置登录密码
        </div>
        <form method="POST" action="/set_password">
            <input type="hidden" name="user_id" value="{{ user_id }}">
            <input type="hidden" name="username" value="{{ username }}">
            <div class="mb-3">
                <label class="form-label">设置密码</label>
                <div class="position-relative">
                    <input type="password" class="form-control" name="password" id="newPassword"
                           placeholder="请输入密码（至少4位）" required minlength="4" autofocus>
                    <button type="button" class="password-toggle" onclick="togglePassword('newPassword', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">确认密码</label>
                <div class="position-relative">
                    <input type="password" class="form-control" name="password_confirm" id="confirmPassword"
                           placeholder="再次输入密码" required minlength="4">
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-shield-check me-2"></i>设置密码并登录
            </button>
        </form>

        {% else %}
        <!-- 正常登录模式 -->
        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" name="username" id="username"
                       placeholder="用户名 / 手机号 / 邮箱" required autofocus
                       value="{{ request.form.get('username', '') }}">
            </div>
            <div class="mb-4">
                <label class="form-label">密码</label>
                <div class="position-relative">
                    <input type="password" class="form-control" name="password" id="loginPassword"
                           placeholder="请输入密码">
                    <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>登录
            </button>
        </form>
        {% endif %}
    </div>

    <script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }
    </script>
</body>
</html>
