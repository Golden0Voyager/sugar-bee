[project]

authors = [
    { name = "Haining Yu" }
]
keywords = ["health", "glucose-tracker", "ai"]
name = "sugar-bee"
version = "0.2.4"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "openai>=2.29.0",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "httpx>=0.28.1",
    "mcp>=1.30.0,<2.0.0",
    "google-genai>=1.56.0",
    "google-ai-generativelanguage>=0.6.15",
    "google-api-core>=2.28.1",
    "google-auth>=2.45.0",
    "Flask-Limiter>=4.1.1",
    "sqlalchemy>=2.0.50",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
    "reportlab>=4.4.10",
    "pillow>=13.0.0",
    "openpyxl>=3.1.5",
    # Security pins for transitive dependencies
    "certifi>=2026.10.18",
    "cryptography>=50.0.0",
    "idna>=3.15",
    "mako>=1.4.2",
    "pyasn1>=0.6.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
    "werkzeug>=3.1.9",
    # Garmin 同步是线上功能（services/garmin_service.py），必须属生产依赖。
    # 此前误放在 [dependency-groups] dev，`uv export --no-dev` 会被排除，导致部署缺包。
    "garminconnect>=0.3.0",
    "pypdfium2>=5.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.1.1",
    "ruff>=0.15.7",
    "pytest-flask>=1.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
extend = "~/.config/ruff/ruff.toml"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "E702"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM102", "SIM117"]
"mcp_adapter/tests/*" = ["SIM102", "SIM117"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "migrations/*",
    "wsgi.py",
    "mcp_writer.py",
    "mcp_reader.py",
    "garmin_login.py",
    "test_ai_compare.py",
    "main.py",
    "mcp_adapter/*",
    "scripts/sync_pg_to_sqlite.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def __repr__",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests", "mcp_adapter/tests"]
