[project]

authors = [
    { name = "Haining Yu" }
]
keywords = ["health", "glucose-tracker", "ai"]
name = "sugar-bee"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "openai>=2.29.0",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "httpx>=0.28.1",
    "mcp>=1.27.0",
    "google-genai>=1.56.0",
    "google-ai-generativelanguage>=0.6.15",
    "google-api-core>=2.28.1",
    "google-auth>=2.45.0",
    "Flask-Limiter>=4.1.1",
    "sqlalchemy>=2.0.50",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
    "reportlab>=4.4.10",
    "pillow>=12.2.0",
    "openpyxl>=3.1.5",
    # Security pins for transitive dependencies
    "cryptography>=48.0.1",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.1.1",
    "ruff>=0.15.7",
    "pytest-flask>=1.3.0",
    "pytest-asyncio>=0.24.0",
    "garminconnect>=0.3.0",
]

[tool.ruff]
extend = "~/.config/ruff/ruff.toml"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "E702"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "migrations/*",
    "wsgi.py",
    "mcp_server.py",
    "garmin_login.py",
    "test_ai_compare.py",
    "main.py",
    "mcp_adapter/*",
    "scripts/sync_pg_to_sqlite.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def __repr__",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests", "mcp_adapter/tests"]
