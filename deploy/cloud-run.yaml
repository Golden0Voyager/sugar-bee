apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sugar-bee
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/execution-environment: gen2
        # Cloud SQL 实例连接（PostgreSQL 生产模式必需）
        run.googleapis.com/cloudsql-instances: 'project-c0560c79-7c6a-4f31-a11:asia-east2:sugar-bee-db-hk'
    spec:
      containerConcurrency: 1
      timeoutSeconds: 300
      containers:
        - image: asia-east2-docker.pkg.dev/project-c0560c79-7c6a-4f31-a11/sugar-bee/sugar-bee
          ports:
            - containerPort: 8080
          env:
            - name: FLASK_ENV
              value: production
            - name: SUGAR_BEE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SUGAR_BEE_DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SUGAR_BEE_SECRET_KEY
            - name: GCS_BUCKET_NAME
              value: sugar-bee-data
            - name: GUNICORN_WORKERS
              value: '1'
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SUGAR_BEE_INTERNAL_API_TOKEN
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
      serviceAccountName: sugar-bee@project-c0560c79-7c6a-4f31-a11.iam.gserviceaccount.com
  traffic:
    - latestRevision: true
      percent: 100
