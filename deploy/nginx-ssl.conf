# ============================================================================
# 【已废弃 · 请勿用于当前生产】2026-10-30
#
# 当前生产（Lighthouse 123.207.183.128）用的是 scripts/ops/nginx/ 下的配置：
#   scripts/ops/nginx/nginx.conf          → http 级全局配置（gzip 等）
#   scripts/ops/nginx/sugar-bee.site.conf → server 级站点配置
# 由 scripts/ops/install_ops.sh 同步到服务器，仓库是唯一事实来源。
#
# 与本文件的差异（所以不能直接用）：
#   · 静态文件：这里用 alias 让 nginx 直接读盘；现网用 proxy_pass 回 Flask。
#     alias 方案会让 nginx 与 Flask 的文件不同源，hash 版本化会算错。
#   · 这里没有 gzip_comp_level 6、没有 /v/ 版本化路径的 immutable 缓存。
#   · 这里的限速区 / 安全头与现网不一致。
#
# 保留它只为记录「曾经用过的自研方案」。要用请先与现网配置对齐。
# ============================================================================

# Sugar Bee - Nginx HTTPS 配置（Let's Encrypt）
#
# 前置步骤：先按 deploy/README.md 申请 SSL 证书，再使用此配置

# HTTP: 强制跳转到 HTTPS
server {
    listen 80;
    server_name your-domain.com;  # <-- 修改为你的域名
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name your-domain.com;  # <-- 修改为你的域名

    # SSL 证书（Let's Encrypt 默认路径）
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS（强制浏览器使用 HTTPS）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态文件
    location /static/ {
        alias /var/www/sugar-bee/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/avatars/ {
        alias /var/www/sugar-bee/static/avatars/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 登录限速（Nginx 层双重保护）
    location /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 主应用转发
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/sugar-bee-access.log;
    error_log /var/log/nginx/sugar-bee-error.log;
}
