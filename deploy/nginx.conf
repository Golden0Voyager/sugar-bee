# Sugar Bee - Nginx 反向代理配置
#
# 使用方式：
#   1. 安装 Nginx: sudo apt install nginx
#   2. 复制此文件: sudo cp deploy/nginx.conf /etc/nginx/sites-available/sugar-bee
#   3. 创建符号链接: sudo ln -s /etc/nginx/sites-available/sugar-bee /etc/nginx/sites-enabled/
#   4. 测试配置: sudo nginx -t
#   5. 重载 Nginx: sudo systemctl reload nginx
#
# HTTPS 配置（Let's Encrypt）见 deploy/README.md

# 限速区域（防止暴力破解）
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name your-domain.com;  # <-- 修改为你的域名

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态文件（由 Nginx 直接服务，不经过 Gunicorn）
    location /static/ {
        alias /var/www/sugar-bee/static/;  # <-- 修改为你的项目 static 路径
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 头像文件
    location /static/avatars/ {
        alias /var/www/sugar-bee/static/avatars/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 健康检查（无需限速）
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 登录接口限速
    location /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他请求转发到 Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如未来需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # 日志
    access_log /var/log/nginx/sugar-bee-access.log;
    error_log /var/log/nginx/sugar-bee-error.log;
}
