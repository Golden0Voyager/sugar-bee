# ============================================================================
# 【已废弃 · 请勿用于当前生产】2026-10-30
#
# 当前生产（Lighthouse 123.207.183.128）用的是 scripts/ops/nginx/ 下的配置：
#   scripts/ops/nginx/nginx.conf          → http 级全局配置（gzip 等）
#   scripts/ops/nginx/sugar-bee.site.conf → server 级站点配置
# 由 scripts/ops/install_ops.sh 同步到服务器，仓库是唯一事实来源。
#
# 与本文件的差异（所以不能直接用）：
#   · 静态文件：这里用 alias 让 nginx 直接读盘；现网用 proxy_pass 回 Flask。
#     alias 方案会让 nginx 与 Flask 的文件不同源，hash 版本化会算错。
#   · 这里没有 gzip_comp_level 6、没有 /v/ 版本化路径的 immutable 缓存。
#   · 这里的限速区 / 安全头与现网不一致。
#
# 保留它只为记录「曾经用过的自研方案」。要用请先与现网配置对齐。
# ============================================================================

# Sugar Bee - Nginx 反向代理配置
#
# 使用方式：
#   1. 安装 Nginx: sudo apt install nginx
#   2. 复制此文件: sudo cp deploy/nginx.conf /etc/nginx/sites-available/sugar-bee
#   3. 创建符号链接: sudo ln -s /etc/nginx/sites-available/sugar-bee /etc/nginx/sites-enabled/
#   4. 测试配置: sudo nginx -t
#   5. 重载 Nginx: sudo systemctl reload nginx
#
# HTTPS 配置（Let's Encrypt）见 deploy/README.md

# 限速区域（防止暴力破解）
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name your-domain.com;  # <-- 修改为你的域名

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态文件（由 Nginx 直接服务，不经过 Gunicorn）
    location /static/ {
        alias /var/www/sugar-bee/static/;  # <-- 修改为你的项目 static 路径
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 头像文件
    location /static/avatars/ {
        alias /var/www/sugar-bee/static/avatars/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 健康检查（无需限速）
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 登录接口限速
    location /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他请求转发到 Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如未来需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # 日志
    access_log /var/log/nginx/sugar-bee-access.log;
    error_log /var/log/nginx/sugar-bee-error.log;
}
