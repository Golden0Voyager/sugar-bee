server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 20M;

    # 安全头。
    # 注意 nginx 的 add_header 是「替换」而不是「追加」：
    # 只要某个 location 里出现了 add_header，本 server 级的这些就全部失效。
    # 所以下面每个 location 都自带一份，不要以为 server 级会兜底。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 头像：用户私人图片，不走 public 长缓存（避免被中间缓存留存）
    location /static/avatars/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        add_header Cache-Control "private, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # 固定路径的静态资源（模板已改用 /v/ 版本化路径，这里是历史兼容）。
    #
    # 为什么不用 `expires 30d`：Flask 的静态响应自带 `Cache-Control: no-cache`，
    # 两者并存时 no-cache 优先，30 天缓存等于没生效（实测确认）。
    # 改成藏掉上游的头、自己发一条，来源唯一不会打架。
    #
    # 也不加 immutable：这个路径不含内容 hash，内容变了 URL 不变，
    # immutable 会让浏览器在缓存期内完全不再验证，热修就发不出去了。
    location /static/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # 版本化静态资源 /v/<路径>.<内容hash>.<扩展名>。
    # 内容一变 URL 就变，所以可以永久缓存；旧 hash 直接 404，
    # 不会把旧文件悄悄发出去。
    location /v/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
