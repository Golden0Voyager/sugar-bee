# Octop 控制台 HTTPS 反代（自签证书）
# 目的：8088 不再对公网开放，只监听 127.0.0.1；外部只能经 8443 的 TLS 访问。
# 微信 iLink Bot / 飞书 WS 都是主动出站长连接，不依赖本端口。
server {
    listen 8443 ssl;
    server_name 123.207.183.128;

    ssl_certificate     /etc/ssl/sugarbee/fullchain.crt;
    ssl_certificate_key /etc/ssl/sugarbee/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:OctopTLS:10m;
    ssl_session_timeout 10m;

    # 压缩：Octop 的 SPA 前端有大量 JS chunk，3Mbps 下这是主要瓶颈
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:8443;

        # WebSocket / SSE（AI 流式对话）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
